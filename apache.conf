<VirtualHost *:80>
    DocumentRoot /var/www/html/pub
    <Directory /var/www/html/pub>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
<VirtualHost *:443>
    ServerName localhost
    DocumentRoot /var/www/html/pub
    SSLEngine on
    SSLCertificateFile /etc/apache2/local-tls/localhost.crt
    SSLCertificateKeyFile /etc/apache2/local-tls/localhost.key
    <Directory /var/www/html/pub>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
