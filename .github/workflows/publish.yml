name: Publish image
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Download locked source bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download source-2.4.8 --pattern magento-2.4.8-source.tar.gz
          sha256sum --check source.sha256
          tar -xzf magento-2.4.8-source.tar.gz
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/virtuosooo/magento248-php8427:2.4.8-php8.4.27
          labels: org.opencontainers.image.source=https://github.com/Virtuosooo/magento248-php8427-docker
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify published PHP and Magento versions on both architectures
        run: |
          for platform in linux/amd64 linux/arm64; do
            image=ghcr.io/virtuosooo/magento248-php8427:2.4.8-php8.4.27
            docker pull --platform "$platform" "$image"
            docker run --rm --platform "$platform" --entrypoint php "$image" -r 'if(PHP_VERSION !== "8.4.27"){exit(1);} echo PHP_VERSION, PHP_EOL;'
            docker run --rm --platform "$platform" --entrypoint php "$image" /opt/magento/bin/magento --version | grep -Fx 'Magento CLI 2.4.8'
            docker run --rm --platform "$platform" --entrypoint composer "$image" --working-dir=/opt/magento check-platform-reqs --no-dev
          done
